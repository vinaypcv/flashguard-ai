name: FlashGuard Deterministic Storage Verification

on:
  push:
    branches:
      - main
      - feature/verified-storage-v2
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-mcp-harness:
    name: Verify MCP Chaos Harness (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MCP dependencies & verify virtual drive fixtures
        run: |
          pip install 'mcp>=1.0,<2'
          python -m unittest discover -p 'test_*.py' -v
        working-directory: ./mcp-server

  verify-flutter-engine:
    name: Verify Flutter Integrity & Isolate Suite
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: verify-mcp-harness
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get
        working-directory: ./app

      - name: Run static analysis (flutter analyze)
        run: flutter analyze --fatal-infos
        working-directory: ./app

      - name: Run Flutter tests
        run: flutter test --concurrency=1 --timeout 2m --reporter expanded
        working-directory: ./app

  verify-real-filesystem:
    name: Native process recovery (${{ matrix.os }}, ${{ matrix.blockMiB }} MiB)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        blockMiB: [4, 16]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - name: Exercise native promotion
        run: flutter test --no-pub test/atomic_file_promoter_native_test.dart --reporter expanded
        working-directory: app
      - name: Kill and restart independent production workers
        run: dart --packages=app/.dart_tool/package_config.json benchmarks/storage_reliability/run.dart --suite=reliability --rounds=5 --block-mib=${{ matrix.blockMiB }} --output=benchmarks/storage_reliability/results/ci-${{ runner.os }}-block-${{ matrix.blockMiB }}-reliability.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filesystem-evidence-${{ runner.os }}-block-${{ matrix.blockMiB }}
          path: benchmarks/storage_reliability/results/ci-*.json

  verify-performance-smoke:
    name: Bounded performance smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - name: Warm up and measure a 1 MiB fixture twice
        run: dart --packages=app/.dart_tool/package_config.json benchmarks/storage_reliability/run.dart --suite=smoke --output=benchmarks/storage_reliability/results/ci-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-smoke-evidence
          path: benchmarks/storage_reliability/results/ci-smoke.json
