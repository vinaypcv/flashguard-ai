  <!-- Background & Border -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)" stroke="#30363D" stroke-width="2"/>
  <rect x="0" y="0" width="8" height="320" rx="4" fill="url(#crimson)"/>

  <!-- Header -->
  <text x="48" y="62" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700">
    FlashGuard AI
