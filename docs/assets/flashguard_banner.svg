  </text>

  <!-- Pillar 1: MCP Chaos Server -->
  <rect x="48" y="124" width="335" height="156" rx="12" fill="#1F242C" stroke="#30363D" stroke-width="1.5"/>
  <text x="72" y="156" fill="#FF7B72" font-family="monospace" font-size="13" font-weight="700">01 // TEAM MULTIPLIER</text>
  <text x="72" y="184" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="600">flashguard-chaos MCP</text>
  <text x="72" y="212" fill="#8B949E" font-family="sans-serif" font-size="13">• Virtual SSD Fault-Injection Sandbox</text>
  <text x="72" y="234" fill="#8B949E" font-family="sans-serif" font-size="13">• Truncated MP4 &amp; Cable-Yank Mocks</text>
  <text x="72" y="256" fill="#8B949E" font-family="sans-serif" font-size="13">• /verify-storage-pr Slash Guardrail</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 392 202 L 424 202" stroke="#D71920" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="424,196 434,202 424,208" fill="#D71920"/>

  <!-- Pillar 2: Isolate Core -->
  <rect x="440" y="124" width="335" height="156" rx="12" fill="#1F242C" stroke="#D71920" stroke-width="1.5"/>
  <text x="464" y="156" fill="#FF7B72" font-family="monospace" font-size="13" font-weight="700">02 // ISOLATE ENGINE (O(1) RAM)</text>
  <text x="464" y="184" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="600">Zero-Jank Verification Core</text>
  <text x="464" y="212" fill="#8B949E" font-family="sans-serif" font-size="13">• Streaming SHA-256 &amp; Atomic .part</text>
  <text x="464" y="234" fill="#8B949E" font-family="sans-serif" font-size="13">• MP4 moov &amp; JPEG EOF Forensics</text>
  <text x="464" y="256" fill="#8B949E" font-family="sans-serif" font-size="13">• Exact SHA-256 Duplicate Groups</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 784 202 L 816 202" stroke="#D71920" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="816,196 826,202 816,208" fill="#D71920"/>

  <!-- Pillar 3: Consumer UX -->
  <rect x="832" y="124" width="320" height="156" rx="12" fill="#1F242C" stroke="#30363D" stroke-width="1.5"/>
  <text x="856" y="156" fill="#3FB950" font-family="monospace" font-size="13" font-weight="700">03 // CONSUMER TRUST UX</text>
  <text x="856" y="184" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="600">Material 3 Companion</text>
  <text x="856" y="212" fill="#8B949E" font-family="sans-serif" font-size="13">• Drive Confidence Score (0–100)</text>
  <text x="856" y="234" fill="#8B949E" font-family="sans-serif" font-size="13">• Thermal Throttling Diagnostics</text>
  <text x="856" y="256" fill="#8B949E" font-family="sans-serif" font-size="13">• Per-File Copy Verification Status</text>
