  <rect x="255" y="38" width="235" height="30" rx="15" fill="#D71920" fill-opacity="0.2" stroke="#D71920" stroke-width="1.5"/>
  <text x="372" y="58" text-anchor="middle" fill="#FF7B72" font-family="monospace" font-size="13" font-weight="600">
    SANDISK CONSUMER FLUTTER
  </text>
  <text x="48" y="92" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16">
